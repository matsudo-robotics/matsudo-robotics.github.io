<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-TIC ソフト開発支援ツール</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5;
  --panel:#FFFFFF;
  --ink:#20262E;
  --ink2:#5A636E;
  --grid:#E2E6DF;
  --line:#C9CFC6;
  --blue:#6D4FA8;
  --blue-soft:#EFEAF7;
  --red:#B23A2E;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --sans:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-size:14px;line-height:1.6;
}
/* ===== 表題欄風ヘッダー ===== */
header{
  background:var(--panel);border-bottom:2px solid var(--ink);
  display:flex;align-items:stretch;flex-wrap:wrap;
}
.tb-cell{border-right:1px solid var(--ink);padding:8px 16px;display:flex;flex-direction:column;justify-content:center}
.tb-label{font-size:10px;color:var(--ink2);letter-spacing:.08em}
.tb-value{font-size:16px;font-weight:700}
.tb-title{flex:1;min-width:220px}
.tb-title .tb-value{font-size:20px;letter-spacing:.04em}
.tb-title .tb-value span{color:var(--blue)}
.tb-stamp{
  align-self:center;margin:6px 14px;width:44px;height:44px;border:2px solid var(--red);
  border-radius:50%;color:var(--red);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;transform:rotate(-8deg);flex-shrink:0;
}
/* ===== レイアウト ===== */
.app{display:flex;min-height:calc(100vh - 62px)}
nav{
  width:216px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--ink);
  padding:12px 0 80px;
}
.nav-group{padding:10px 14px 4px;font-size:11px;color:var(--ink2);letter-spacing:.1em;border-top:1px dashed var(--line);margin-top:8px}
.nav-group:first-child{border-top:none;margin-top:0}
.nav-item{
  display:block;width:100%;text-align:left;padding:7px 14px 7px 22px;border:none;background:none;
  font-family:var(--sans);font-size:13.5px;color:var(--ink);cursor:pointer;position:relative;
}
.nav-item:hover{background:var(--blue-soft)}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
main{flex:1;padding:20px 24px 120px;min-width:0}
h2.page-title{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.page-sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.page-sub code{font-family:var(--mono)}
/* ===== テーブル ===== */
.tool-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=text],input[type=number],select{
  font-family:var(--mono);font-size:13.5px;padding:6px 9px;border:1px solid var(--ink);
  border-radius:0;background:#fff;color:var(--ink);
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.data-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--ink)}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.data th{
  background:var(--ink);color:#fff;font-weight:500;padding:6px 10px;text-align:left;
  font-size:12px;white-space:nowrap;position:sticky;top:0;
}
table.data td{padding:5px 10px;border-bottom:1px solid var(--grid);font-family:var(--mono);white-space:nowrap}
table.data td.jp{font-family:var(--sans)}
table.data tr.sel-row{cursor:pointer}
table.data tr.sel-row:hover{background:var(--blue-soft)}
table.data tr.selected{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
/* ===== 詳細パネル ===== */
.detail{
  display:none;margin-top:16px;background:var(--panel);border:1px solid var(--ink);
}
.detail.open{display:grid;grid-template-columns:minmax(300px,420px) 1fr}
.detail-draw{border-right:1px dashed var(--line);padding:14px;display:flex;align-items:center;justify-content:center;background:
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;background-color:#FCFDFB}
.detail-info{padding:14px 18px}
.detail-info h3{font-size:16px;margin-bottom:8px;color:var(--blue)}
.spec-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:13.5px}
.spec-grid dt{color:var(--ink2)}
.spec-grid dd{font-family:var(--mono);font-weight:500}
.note{margin-top:10px;font-size:12px;color:var(--ink2);border-left:3px solid var(--line);padding-left:8px}
/* ===== 計算フォーム ===== */
.calc-card{background:var(--panel);border:1px solid var(--ink);padding:16px 18px;margin-bottom:16px;max-width:760px}
.calc-card h3{font-size:15px;margin-bottom:10px}
.form-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.form-row label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
.result-box{
  margin-top:10px;border:1px solid var(--blue);background:var(--blue-soft);padding:10px 14px;
  font-family:var(--mono);font-size:14px;white-space:pre-wrap;display:none;
}
.result-box.show{display:block}
.result-box .big{font-size:19px;font-weight:600;color:var(--blue)}
.result-box .warn{color:var(--red);font-weight:600}
button.act{
  font-family:var(--sans);font-size:13.5px;font-weight:700;padding:7px 18px;cursor:pointer;
  background:var(--blue);color:#fff;border:1px solid var(--blue);
}
button.act:hover{background:#55398a}
button.ghost{
  font-family:var(--sans);font-size:12.5px;padding:5px 12px;cursor:pointer;
  background:#fff;color:var(--ink);border:1px solid var(--ink);
}
button.ghost:hover{background:var(--blue-soft)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* ===== SVG図面 ===== */
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
svg .dim{stroke:var(--blue);stroke-width:1;fill:none}
svg .dimtxt{fill:var(--blue);font-size:11px}
svg .body{stroke:var(--ink);stroke-width:1.6;fill:#fff}
svg .hatch{stroke:var(--ink2);stroke-width:.7}
svg .cl{stroke:var(--red);stroke-width:.7;stroke-dasharray:8 3 2 3}
/* ===== 電卓 ===== */
#calcFab{
  position:fixed;right:22px;bottom:22px;z-index:900;width:58px;height:58px;border-radius:50%;
  background:var(--ink);color:#fff;border:none;font-size:22px;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25);font-family:var(--mono);
}
#calcFab:hover{background:var(--blue)}
#calcWin{
  position:fixed;z-index:950;width:300px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:6px 6px 0 rgba(32,38,46,.18);display:none;top:90px;right:30px;
}
#calcWin.open{display:block}
#calcHead{
  background:var(--ink);color:#fff;padding:6px 10px;font-size:12.5px;cursor:move;
  display:flex;justify-content:space-between;align-items:center;user-select:none;touch-action:none;
}
#calcHead button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;padding:0 4px}
#calcDisp{
  font-family:var(--mono);padding:8px 10px 2px;text-align:right;min-height:26px;font-size:13px;
  color:var(--ink2);word-break:break-all;
}
#calcRes{font-family:var(--mono);padding:0 10px 8px;text-align:right;font-size:22px;font-weight:600;min-height:32px}
#calcKeys{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
#calcKeys button{
  font-family:var(--mono);font-size:14px;padding:10px 0;border:none;background:var(--panel);cursor:pointer;
}
#calcKeys button:hover{background:var(--blue-soft)}
#calcKeys button.op{background:#F0F2ED}
#calcKeys button.eq{background:var(--blue);color:#fff}
#calcKeys button.eq:hover{background:#55398a}
#calcHist{max-height:90px;overflow-y:auto;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;padding:4px 10px;color:var(--ink2)}
#calcHist div{cursor:pointer;padding:1px 0}
#calcHist div:hover{color:var(--blue)}
.deg-toggle{font-family:var(--mono);font-size:11px;background:var(--red);padding:1px 6px;border-radius:2px;cursor:pointer}
/* code block */
.code-wrap{position:relative;margin:10px 0}
.code-wrap pre{background:#23272E;color:#E8EAED;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;border:1px solid var(--ink)}
.code-wrap .copy-btn{position:absolute;top:6px;right:6px;font-family:var(--sans);font-size:11px;padding:3px 10px;background:var(--blue);color:#fff;border:none;cursor:pointer}
.code-wrap .copy-btn:hover{opacity:.85}
.bitgrid{display:flex;flex-wrap:wrap;gap:2px;font-family:var(--mono);font-size:12px;margin-top:8px}
.bitgrid span{width:22px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.bitgrid span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bitgrid i{width:8px}
/* footer note */
.foot-note{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--ink);
  font-size:11px;color:var(--ink2);padding:4px 14px;z-index:800}
@media(max-width:860px){
  .app{flex-direction:column}
  nav{width:100%;display:flex;overflow-x:auto;padding:0}
  .nav-group{display:none}
  .nav-item{white-space:nowrap;padding:10px 12px}
  .nav-item.active::before{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}
  .detail.open{grid-template-columns:1fr}
  .detail-draw{border-right:none;border-bottom:1px dashed var(--line)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;left:14px;bottom:14px;z-index:9999;background:#0E6B4E;color:#fff;text-decoration:none;font-size:13px;padding:9px 16px;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:sans-serif">← ツール一覧</a>

<header>
  <div class="tb-cell tb-title">
    <span class="tb-label">名称 TITLE</span>
    <span class="tb-value">M-TIC <span>ソフト開発支援ツール</span></span>
  </div>
  <div class="tb-cell">
    <span class="tb-label">所属</span>
    <span class="tb-value" style="font-size:13px">NPO法人 松戸技術革新センター</span>
  </div>
  <div class="tb-cell">
    <span class="tb-label">版</span>
    <span class="tb-value" style="font-size:13px;font-family:var(--mono)">Rev.3.0</span>
  </div>
</header>

<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>

<button id="calcFab" title="関数電卓を開く">∑</button>

<div id="calcWin" role="dialog" aria-label="関数電卓">
  <div id="calcHead">
    <span>関数電卓 <span class="deg-toggle" id="degToggle">DEG</span></span>
    <span>
      <button id="calcClearHist" title="履歴クリア">⌫</button>
      <button id="calcClose" title="閉じる">×</button>
    </span>
  </div>
  <div id="calcDisp">&nbsp;</div>
  <div id="calcRes">0</div>
  <div id="calcKeys"></div>
  <div id="calcHist"></div>
</div>

<div class="foot-note">※ コード例はそのまま使ってOK（M-TIC内製・改変自由）。制御パラメータは必ず実機で安全に確認してください。文中の製品型番・規格名称は各社・各団体の商標または登録商標です。</div>

<script>

const $=s=>document.querySelector(s);
const fmt=(x,n=3)=>Number(x.toFixed(n)).toString();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function show(sel,html){const el=$(sel);el.innerHTML=html;el.classList.add("show")}
function specList(pairs){return `<dl class="spec-grid">${pairs.map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join("")}</dl>`}
function codeBlock(code,id){
 return `<div class="code-wrap"><button class="copy-btn" onclick="copyCode('${id}')">コピー</button><pre id="${id}">${esc(code)}</pre></div>`;
}
function copyCode(id){
 const t=document.getElementById(id).textContent;
 if(navigator.clipboard){navigator.clipboard.writeText(t)}
 else{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
 event.target.textContent="コピーした！";setTimeout(()=>{event.target.textContent="コピー"},1200);
}

/* =========================================================
   ソフト開発支援ツール
   ========================================================= */
const PAGES=[
 {group:"変換・計算"},
 {id:"radix",label:"進数変換・ビット操作"},
 {id:"bitop",label:"ビット演算計算機"},
 {id:"crc",label:"チェックサム・CRC計算"},
 {id:"encoder",label:"エンコーダ・分解能計算"},
 {id:"timing",label:"周期・周波数・タイマ"},
 {group:"制御"},
 {id:"pid",label:"PIDチューニング"},
 {id:"filter",label:"フィルタ設計（平滑化）"},
 {id:"odometry",label:"オドメトリ（自己位置）"},
 {group:"通信"},
 {id:"comm",label:"UART / I2C / SPI 早見"},
 {id:"can",label:"CAN通信"},
 {id:"i2caddr",label:"I2Cアドレス一覧"},
 {id:"ascii",label:"ASCIIコード表"},
 {id:"colorhex",label:"カラーコード変換(HEX/RGB)"},
 {group:"コード・開発"},
 {id:"snippets",label:"定番コードスニペット"},
 {id:"types",label:"データ型・落とし穴早見"},
 {id:"git",label:"Gitチートシート"},
 {id:"practice",label:"開発の作法・大会運用"}
];
const RENDER={};

/* ---- 進数変換 ---- */
RENDER.radix=()=>{
 $("#main").innerHTML=`<h2 class="page-title">進数変換・ビット操作</h2>
 <p class="page-sub">どれか1つ入力すると他が更新。ビットのマスをクリックしてもOK（32bit・符号なし）。</p>
 <div class="calc-card">
 <div class="form-row">
  <label>10進<input type="text" id="rDec" value="180"></label>
  <label>16進<input type="text" id="rHex"></label>
  <label>2進<input type="text" id="rBin" style="min-width:260px"></label>
 </div>
 <div id="rBits" class="bitgrid"></div>
 <div class="result-box show" id="rInfo"></div>
 </div>
 <div class="calc-card"><h3>シフト・便利表示</h3>
 <div class="form-row">
  <label>シフト量<input type="number" id="rShift" value="1" min="0" max="31"></label>
 </div>
 <button class="ghost" id="rShl">&lt;&lt; 左シフト</button>
 <button class="ghost" id="rShr">&gt;&gt; 右シフト</button>
 <button class="ghost" id="rNot">~ 反転(NOT)</button>
 </div>`;
 let val=180n;
 const MASK=0xFFFFFFFFn;
 const render=()=>{
  val&=MASK;
  $("#rDec").value=val.toString(10);
  $("#rHex").value="0x"+val.toString(16).toUpperCase().padStart(2,"0");
  $("#rBin").value="0b"+val.toString(2);
  // bit grid (31..0)
  let g="";
  for(let i=31;i>=0;i--){
   const on=(val>>BigInt(i))&1n;
   g+=`<span data-b="${i}" class="${on?"on":""}">${on}</span>`;
   if(i%8===0&&i>0)g+=`<i></i>`;
  }
  $("#rBits").innerHTML=g+`<div style="width:100%;font-size:10px;color:var(--ink2);margin-top:2px">← bit31　　　　　　　　　　　　　　　　bit0 →</div>`;
  document.querySelectorAll("#rBits span").forEach(sp=>sp.onclick=()=>{val^=(1n<<BigInt(sp.dataset.b));render()});
  const bytes=[];
  for(let i=3;i>=0;i--)bytes.push(((val>>BigInt(i*8))&0xFFn).toString(16).toUpperCase().padStart(2,"0"));
  $("#rInfo").innerHTML=`バイト表現: [${bytes.join(", ")}]（ビッグエンディアン順）　立っているビット数: ${val.toString(2).split("1").length-1}
8bitとして: ${val&0xFFn}　16bitとして: ${val&0xFFFFn}　符号付き8bit: ${(val&0xFFn)>127n?(val&0xFFn)-256n:val&0xFFn}`;
 };
 const parse=(s,base)=>{try{s=s.trim().replace(/^0x/i,"").replace(/^0b/i,"").replace(/[\s_]/g,"");if(!s)return null;const v=BigInt((base===16?"0x":base===2?"0b":"")+s);return v>=0n?v&MASK:null}catch(e){return null}};
 $("#rDec").oninput=e=>{const v=parse(e.target.value,10);if(v!=null){val=v;render();e.target.focus()}};
 $("#rHex").oninput=e=>{const v=parse(e.target.value,16);if(v!=null){val=v;render()}};
 $("#rBin").oninput=e=>{const v=parse(e.target.value,2);if(v!=null){val=v;render()}};
 $("#rShl").onclick=()=>{val=(val<<BigInt(+$("#rShift").value))&MASK;render()};
 $("#rShr").onclick=()=>{val=val>>BigInt(+$("#rShift").value);render()};
 $("#rNot").onclick=()=>{val=(~val)&MASK;render()};
 render();
};

/* ---- ビット演算 ---- */
RENDER.bitop=()=>{
 $("#main").innerHTML=`<h2 class="page-title">ビット演算計算機</h2>
 <p class="page-sub">A・Bは 10進 / 0x16進 / 0b2進 どれでも入力OK。</p>
 <div class="calc-card">
 <div class="form-row">
  <label>A<input type="text" id="bA" value="0xF0"></label>
  <label>演算<select id="bOp"><option>AND</option><option>OR</option><option>XOR</option><option>A &lt;&lt; B</option><option>A &gt;&gt; B</option></select></label>
  <label>B<input type="text" id="bB" value="0b10101010"></label>
 </div>
 <button class="act" id="bGo">計算</button><div class="result-box" id="bRes"></div>
 <p class="note">レジスタ操作の定番イディオム：セット reg |= (1&lt;&lt;n) ／ クリア reg &amp;= ~(1&lt;&lt;n) ／ 反転 reg ^= (1&lt;&lt;n) ／ 判定 if(reg &amp; (1&lt;&lt;n))</p>
 </div>`;
 const parse=s=>{try{s=s.trim().replace(/[\s_]/g,"");return BigInt(s)&0xFFFFFFFFn}catch(e){return null}};
 $("#bGo").onclick=()=>{
  const a=parse($("#bA").value),b=parse($("#bB").value),op=$("#bOp").value;
  if(a==null||b==null){show("#bRes","<span class='warn'>入力を確認してください（例: 255 / 0xFF / 0b1111）</span>");return}
  let r;
  if(op==="AND")r=a&b;else if(op==="OR")r=a|b;else if(op==="XOR")r=a^b;
  else if(op.includes("<<"))r=(a<<b)&0xFFFFFFFFn;else r=a>>b;
  show("#bRes",`<span class="big">= ${r}（0x${r.toString(16).toUpperCase()}）</span>
2進: 0b${r.toString(2)}`);
 };
};

/* ---- CRC ---- */
function crc8(bytes){let c=0;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=c&0x80?((c<<1)^0x07)&0xFF:(c<<1)&0xFF}return c}
function crc16ccitt(bytes){let c=0xFFFF;for(const b of bytes){c^=b<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c}
RENDER.crc=()=>{
 $("#main").innerHTML=`<h2 class="page-title">チェックサム・CRC計算</h2>
 <p class="page-sub">通信プロトコル自作やセンサのデータ検証に。バイト列は16進をスペース区切りで。</p>
 <div class="calc-card">
 <div class="form-row"><label style="flex:1">バイト列（例: 01 A2 FF 30）<input type="text" id="cIn" value="01 A2 FF 30" style="width:100%"></label></div>
 <button class="act" id="cGo">計算</button><div class="result-box" id="cRes"></div>
 <p class="note">CRC-8: 多項式0x07・初期値0x00 ／ CRC-16-CCITT-FALSE: 多項式0x1021・初期値0xFFFF。相手側の仕様（初期値・反転・XOR出力）が違うと一致しないので、既存機器と合わせるときはデータシートの仕様を確認。</p>
 </div>
 <div class="calc-card"><h3>C言語 実装例（CRC-8）</h3>
 ${codeBlock(`uint8_t crc8(const uint8_t *data, size_t len) {
  uint8_t crc = 0x00;
  for (size_t i = 0; i < len; i++) {
    crc ^= data[i];
    for (uint8_t b = 0; b < 8; b++) {
      crc = (crc & 0x80) ? (crc << 1) ^ 0x07 : (crc << 1);
    }
  }
  return crc;
}`,"crcCode")}</div>`;
 $("#cGo").onclick=()=>{
  const parts=$("#cIn").value.trim().split(/[\s,]+/).filter(x=>x);
  const bytes=[];
  for(const p of parts){
   const v=parseInt(p,16);
   if(isNaN(v)||v<0||v>255){show("#cRes","<span class='warn'>16進バイト(00〜FF)で入力してください</span>");return}
   bytes.push(v);
  }
  const sum=bytes.reduce((a,b)=>a+b,0);
  const xor=bytes.reduce((a,b)=>a^b,0);
  const h=v=>"0x"+v.toString(16).toUpperCase().padStart(2,"0");
  show("#cRes",`バイト数: ${bytes.length}
合計: ${sum}（下位8bit: ${h(sum&0xFF)}）　2の補数チェックサム: ${h((~sum+1)&0xFF)}
XORチェックサム: ${h(xor)}
<span class="big">CRC-8: ${h(crc8(bytes))}　CRC-16-CCITT: 0x${crc16ccitt(bytes).toString(16).toUpperCase().padStart(4,"0")}</span>`);
 };
};

  float update(float target, float measured, float dt) {
    float err = target - measured;
    // 微分は「測定値の微分」→ 目標変更時のキックを防ぐ
    float dTerm = -kd * (measured - prevMeasured_) / dt;
    prevMeasured_ = measured;

    float out = kp * err + integral_ + dTerm;
    // アンチワインドアップ: 飽和していなければ積分を進める
    if (out > outMin && out < outMax) integral_ += ki * err * dt;
    return constrain(out, outMin, outMax);
  }
  void reset() { integral_ = 0; prevMeasured_ = 0; }
private:
  float integral_ = 0, prevMeasured_ = 0;
};`,"sn4")}</div>
 <div class="calc-card"><h3>⑤ 状態機械（競技ロボットの骨格）</h3>
 ${codeBlock(`enum class State { IDLE, SEARCH, APPROACH, GRAB, RETURN_HOME };
State state = State::IDLE;
unsigned long stateSince = 0;

void changeState(State next) {
  state = next;
  stateSince = millis();          // 状態タイムアウト用
}

void stateMachine() {
  unsigned long elapsed = millis() - stateSince;
  switch (state) {
    case State::IDLE:
      if (startButton()) changeState(State::SEARCH);
      break;
    case State::SEARCH:
      spinSlowly();
      if (targetFound())   changeState(State::APPROACH);
      if (elapsed > 5000)  changeState(State::RETURN_HOME); // 詰み回避
      break;
    case State::APPROACH:
      driveToTarget();
      if (targetClose())   changeState(State::GRAB);
      break;
    // ...
  }
}`,"sn5")}
 <p class="note">状態ごとに「何をするか」「どこへ遷移するか」「タイムアウト」を必ずセットで書くと、大会で固まらないロボットになります。</p></div>
 <div class="calc-card"><h3>⑥ メディアンフィルタ3点（測距センサのスパイク除去）</h3>
 ${codeBlock(`float med3(float a, float b, float c) {
  if (a > b) { float t = a; a = b; b = t; }
  if (b > c) { float t = b; b = c; c = t; }
  if (a > b) { float t = a; a = b; b = t; }
  return b;
}
// 使い方: 直近3サンプルを保持して med3(s0, s1, s2)`,"sn6")}</div>`;
};

RENDER.odometry=()=>{
 $("#main").innerHTML=`<h2 class="page-title">2輪差動オドメトリ（自己位置推定）</h2>
 <p class="page-sub">左右エンコーダから機体の位置(x, y)と向きθを積算する基本手法。RCJレスキュー・サッカーの土台。</p>
 <div class="calc-card"><h3>計算式</h3>
 ${specList([["左右の移動量","dL, dR ＝ カウント差 × mm/count（エンコーダ計算ページ）"],["中心の移動量","d ＝ (dR ＋ dL) / 2"],["向きの変化","Δθ ＝ (dR − dL) / W　（W＝トレッド幅：左右車輪の中心間距離）"],["位置更新","x ＋= d·cos(θ＋Δθ/2)　　y ＋= d·sin(θ＋Δθ/2)　　θ ＋= Δθ"]])}
 <p class="note">cos/sinの引数を「θ＋Δθ/2」（区間の中間の向き）にするのが精度のコツ。θは±πに正規化して回し続けること。</p></div>
 <div class="calc-card"><h3>実装コード（そのまま使える形）</h3>
 ${codeBlock(`struct Pose { float x = 0, y = 0, theta = 0; };
Pose pose;

const float MM_PER_COUNT = 0.0733f;  // エンコーダ計算ページで算出
const float TREAD_W_MM   = 152.0f;   // 左右車輪の中心間距離(実測推奨)

// 周期処理内で呼ぶ（例:100Hz）。dCountL/Rは前回からのカウント増分
void odomUpdate(long dCountL, long dCountR) {
  float dL = dCountL * MM_PER_COUNT;
  float dR = dCountR * MM_PER_COUNT;
  float d      = (dR + dL) * 0.5f;
  float dTheta = (dR - dL) / TREAD_W_MM;

  pose.x     += d * cosf(pose.theta + dTheta * 0.5f);
  pose.y     += d * sinf(pose.theta + dTheta * 0.5f);
  pose.theta += dTheta;
  // -π〜π に正規化
  while (pose.theta >  PI) pose.theta -= TWO_PI;
  while (pose.theta < -PI) pose.theta += TWO_PI;
}`,"odomCode")}</div>

  <label>左カウント増分<input type="number" id="odL" value="1000"></label>
  <label>右カウント増分<input type="number" id="odR" value="1200"></label>

 </div>
 <div class="calc-card"><h3>精度を上げるコツ・限界</h3>

 <tr><td class="jp">絶対補正</td><td class="jp">ラインや壁・マーカーを検出したら座標をリセット/補正する仕組みを入れる</td></tr>
 </tbody></table></div></div>`;

<span class="big">中心移動 d = ${fmt(d,1)} mm　旋回 Δθ = ${fmt(dth*180/Math.PI,2)}°</span>
${Math.abs(dth)>1e-9?"旋回半径 ≈ "+fmt(d/dth,1)+" mm":"（直進）"}`);

 <p class="note">RGB565はTFT液晶（ILI9341等）の16bit色形式：R5bit・G6bit・B5bit。LEDテープは電流に注意——WS2812は白全点灯で1個あたり最大約60mA（30個で1.8A！）。明るさを1/4に落とすだけで電源がかなり楽になります。</p>
 </div>
 <div class="calc-card"><h3>コード例</h3>
 ${codeBlock(`// NeoPixel (Adafruit_NeoPixel)
strip.setPixelColor(i, strip.Color(255, 136, 0));

// TFT (RGB565を直接指定)
tft.fillRect(x, y, w, h, 0xFC40);

// RGB888 → RGB565 変換マクロ
#define RGB565(r,g,b) ((((r)&0xF8)<<8) | (((g)&0xFC)<<3) | ((b)>>3))`,"cxCode")}</div>`;
 const upd=(r,g,b)=>{
  r=Math.max(0,Math.min(255,r|0));g=Math.max(0,Math.min(255,g|0));b=Math.max(0,Math.min(255,b|0));
  const hex="#"+[r,g,b].map(v=>v.toString(16).toUpperCase().padStart(2,"0")).join("");
  $("#cxHex").value=hex;$("#cxR").value=r;$("#cxG").value=g;$("#cxB").value=b;$("#cxPick").value=hex.toLowerCase();
  $("#cxSwatch").style.background=hex;
  const c565=((r&0xF8)<<8)|((g&0xFC)<<3)|(b>>3);
  const lum=0.2126*r+0.7152*g+0.0722*b;
  $("#cxRes").innerHTML=`<span class="big">${hex}　rgb(${r}, ${g}, ${b})　RGB565: 0x${c565.toString(16).toUpperCase().padStart(4,"0")}</span>
輝度(相対) ≈ ${fmt(lum/255*100,0)}%　${lum>140?"→ 上に載せる文字は黒が読みやすい":"→ 上に載せる文字は白が読みやすい"}`;
 };
 $("#cxHex").addEventListener("input",e=>{
  const m=e.target.value.trim().replace("#","");
  if(/^[0-9a-fA-F]{6}$/.test(m))upd(parseInt(m.slice(0,2),16),parseInt(m.slice(2,4),16),parseInt(m.slice(4,6),16));
  else if(/^[0-9a-fA-F]{3}$/.test(m))upd(parseInt(m[0]+m[0],16),parseInt(m[1]+m[1],16),parseInt(m[2]+m[2],16));
 });
 ["cxR","cxG","cxB"].forEach(id=>$("#"+id).addEventListener("input",()=>upd(+$("#cxR").value,+$("#cxG").value,+$("#cxB").value)));
 $("#cxPick").addEventListener("input",e=>{const m=e.target.value.replace("#","");upd(parseInt(m.slice(0,2),16),parseInt(m.slice(2,4),16),parseInt(m.slice(4,6),16))});
 upd(255,136,0);
};

function buildNav(){
 const nav=$("#nav");
 PAGES.forEach(p=>{
  if(p.group){const g=document.createElement("div");g.className="nav-group";g.textContent=p.group;nav.appendChild(g);return}
  const b=document.createElement("button");b.className="nav-item";b.textContent=p.label;b.dataset.id=p.id;
  b.onclick=()=>{
   document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
   b.classList.add("active");
   RENDER[p.id]();
   window.scrollTo({top:0});
  };
  nav.appendChild(b);
 });
 nav.querySelector(".nav-item").click();
}
/* =========================================================
   関数電卓
   ========================================================= */
let calcExpr="", degMode=true;
const KEYS_LAYOUT=[
 ["sin","cos","tan","π","C"],
 ["asin","acos","atan","e","⌫"],
 ["log","ln","√","^","("],
 ["7","8","9","/",")"],
 ["4","5","6","*","%"],
 ["1","2","3","-","Ans"],
 ["0",".","±","+","="]
];
let lastAns=0;
function calcInit(){
 const keys=$("#calcKeys");
 KEYS_LAYOUT.flat().forEach(k=>{
  const b=document.createElement("button");
  b.textContent=k;
  if("+-*/^%()".includes(k)||["sin","cos","tan","asin","acos","atan","log","ln","√","π","e","±","Ans"].includes(k))b.className="op";
  if(k==="=")b.className="eq";
  b.onclick=()=>keyPress(k);
  keys.appendChild(b);
 });
 $("#calcFab").onclick=()=>{$("#calcWin").classList.toggle("open")};
 $("#calcClose").onclick=()=>$("#calcWin").classList.remove("open");
 $("#calcClearHist").onclick=()=>$("#calcHist").innerHTML="";
 $("#degToggle").onclick=()=>{degMode=!degMode;$("#degToggle").textContent=degMode?"DEG":"RAD";update()};
 // ドラッグ移動
 const win=$("#calcWin"),head=$("#calcHead");
 let drag=null;
 const start=(x,y)=>{const r=win.getBoundingClientRect();drag={dx:x-r.left,dy:y-r.top};win.style.right="auto"};
 const move=(x,y)=>{if(!drag)return;win.style.left=Math.max(0,Math.min(x-drag.dx,innerWidth-80))+"px";win.style.top=Math.max(0,Math.min(y-drag.dy,innerHeight-60))+"px"};
 head.addEventListener("mousedown",e=>{if(e.target.tagName!=="BUTTON"&&!e.target.classList.contains("deg-toggle")){start(e.clientX,e.clientY);e.preventDefault()}});
 addEventListener("mousemove",e=>move(e.clientX,e.clientY));
 addEventListener("mouseup",()=>drag=null);
 head.addEventListener("touchstart",e=>{if(e.target.tagName!=="BUTTON"&&!e.target.classList.contains("deg-toggle")){const t=e.touches[0];start(t.clientX,t.clientY)}},{passive:true});
 addEventListener("touchmove",e=>{if(drag){const t=e.touches[0];move(t.clientX,t.clientY)}},{passive:true});
 addEventListener("touchend",()=>drag=null);
 // キーボード入力
 addEventListener("keydown",e=>{
  if(!$("#calcWin").classList.contains("open"))return;
  if(document.activeElement&&["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(/^[0-9+\-*/().^%]$/.test(e.key)){keyPress(e.key)}
  else if(e.key==="Enter"){keyPress("=");e.preventDefault()}
  else if(e.key==="Backspace")keyPress("⌫");
  else if(e.key==="Escape")$("#calcWin").classList.remove("open");
 });
}
function keyPress(k){
 if(k==="C"){calcExpr="";update();return}
 if(k==="⌫"){
  const m=calcExpr.match(/(asin|acos|atan|sin|cos|tan|log|ln|√|Ans)$/);
  calcExpr=m?calcExpr.slice(0,-m[0].length):calcExpr.slice(0,-1);
  update();return}
 if(k==="="){evaluate();return}
 if(k==="±"){
  // 最後の数値の符号反転
  const m=calcExpr.match(/(\d+\.?\d*)$/);
  if(m){calcExpr=calcExpr.slice(0,-m[0].length)+"(-"+m[0]+")"}
  update();return}
 if(k==="√"){calcExpr+="sqrt(";update();return}
 if(["sin","cos","tan","asin","acos","atan","log","ln"].includes(k)){calcExpr+=k+"(";update();return}
 calcExpr+=k;update();
}
function update(){
 $("#calcDisp").textContent=calcExpr||"\u00a0";
 // ライブプレビュー
 const v=tryEval(calcExpr);
 $("#calcRes").textContent=(v==null)?(calcExpr?"…":"0"):fmtCalc(v);
}
function fmtCalc(v){
 if(!isFinite(v))return "エラー";
 if(Math.abs(v)>=1e10||(Math.abs(v)<1e-7&&v!==0))return v.toExponential(6);
 return Number(v.toPrecision(10)).toString();
}
function tryEval(expr){
 if(!expr)return null;
 try{return calcEval(expr)}catch(e){return null}
}
function calcEval(expr){
 // トークン検証
 const ok=/^(\s|\d|\.|\+|\-|\*|\/|\(|\)|\^|%|π|e|Ans|sin|cos|tan|asin|acos|atan|log|ln|sqrt)+$/;
 if(!ok.test(expr))throw new Error("invalid");
 let s=expr
  .replace(/Ans/g,`(${lastAns})`)
  .replace(/π/g,"(F.PI)")
  .replace(/\^/g,"**")
  .replace(/%/g,"*0.01")
  .replace(/(asin|acos|atan|sin|cos|tan|log|ln|sqrt)/g,"F.$1")
  .replace(/(?<![a-zA-Z.])e(?![a-zA-Z0-9])/g,"(F.E)");
 const rad=x=>degMode?x*Math.PI/180:x;
 const inv=x=>degMode?x*180/Math.PI:x;
 const F={
  PI:Math.PI,E:Math.E,
  sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),
  asin:x=>inv(Math.asin(x)),acos:x=>inv(Math.acos(x)),atan:x=>inv(Math.atan(x)),
  log:Math.log10,ln:Math.log,sqrt:Math.sqrt
 };
 // 置換後の安全確認
 if(/[a-zA-Z]/.test(s.replace(/F\.(PI|E|sin|cos|tan|asin|acos|atan|log|ln|sqrt)/g,"")))throw new Error("invalid");
 const v=Function("F",`"use strict";return (${s})`)(F);
 if(typeof v!=="number")throw new Error("invalid");
 return v;
}
function evaluate(){
 const v=tryEval(calcExpr);
 if(v==null||!isFinite(v)){$("#calcRes").textContent="エラー";return}
 lastAns=v;
 const h=document.createElement("div");
 h.textContent=`${calcExpr} = ${fmtCalc(v)}`;
 h.onclick=()=>{calcExpr=String(fmtCalc(v));update()};
 $("#calcHist").prepend(h);
 calcExpr=fmtCalc(v);
 update();
}

buildNav();
calcInit();
</script>
