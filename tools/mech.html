<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-TIC 設計支援・メカ情報ツール</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5;
  --panel:#FFFFFF;
  --ink:#20262E;
  --ink2:#5A636E;
  --grid:#E2E6DF;
  --line:#C9CFC6;
  --blue:#2456A6;
  --blue-soft:#E8EEF8;
  --red:#B23A2E;
  --mono:'IBM Plex Mono',Consolas,monospace;
  --sans:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-size:14px;line-height:1.6;
}
/* ===== 表題欄風ヘッダー ===== */
header{
  background:var(--panel);border-bottom:2px solid var(--ink);
  display:flex;align-items:stretch;flex-wrap:wrap;
}
.tb-cell{border-right:1px solid var(--ink);padding:8px 16px;display:flex;flex-direction:column;justify-content:center}
.tb-label{font-size:10px;color:var(--ink2);letter-spacing:.08em}
.tb-value{font-size:16px;font-weight:700}
.tb-title{flex:1;min-width:220px}
.tb-title .tb-value{font-size:20px;letter-spacing:.04em}
.tb-title .tb-value span{color:var(--blue)}
.tb-stamp{
  align-self:center;margin:6px 14px;width:44px;height:44px;border:2px solid var(--red);
  border-radius:50%;color:var(--red);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;transform:rotate(-8deg);flex-shrink:0;
}
/* ===== レイアウト ===== */
.app{display:flex;min-height:calc(100vh - 62px)}
nav{
  width:216px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--ink);
  padding:12px 0 80px;
}
.nav-group{padding:10px 14px 4px;font-size:11px;color:var(--ink2);letter-spacing:.1em;border-top:1px dashed var(--line);margin-top:8px}
.nav-group:first-child{border-top:none;margin-top:0}
.nav-item{
  display:block;width:100%;text-align:left;padding:7px 14px 7px 22px;border:none;background:none;
  font-family:var(--sans);font-size:13.5px;color:var(--ink);cursor:pointer;position:relative;
}
.nav-item:hover{background:var(--blue-soft)}
.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
main{flex:1;padding:20px 24px 120px;min-width:0}
h2.page-title{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.page-sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.page-sub code{font-family:var(--mono)}
/* ===== テーブル ===== */
.tool-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
input[type=text],input[type=number],select{
  font-family:var(--mono);font-size:13.5px;padding:6px 9px;border:1px solid var(--ink);
  border-radius:0;background:#fff;color:var(--ink);
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.data-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--ink)}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.data th{
  background:var(--ink);color:#fff;font-weight:500;padding:6px 10px;text-align:left;
  font-size:12px;white-space:nowrap;position:sticky;top:0;
}
table.data td{padding:5px 10px;border-bottom:1px solid var(--grid);font-family:var(--mono);white-space:nowrap}
table.data td.jp{font-family:var(--sans)}
table.data tr.sel-row{cursor:pointer}
table.data tr.sel-row:hover{background:var(--blue-soft)}
table.data tr.selected{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
/* ===== 詳細パネル ===== */
.detail{
  display:none;margin-top:16px;background:var(--panel);border:1px solid var(--ink);
}
.detail.open{display:grid;grid-template-columns:minmax(300px,420px) 1fr}
.detail-draw{border-right:1px dashed var(--line);padding:14px;display:flex;align-items:center;justify-content:center;background:
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;background-color:#FCFDFB}
.detail-info{padding:14px 18px}
.detail-info h3{font-size:16px;margin-bottom:8px;color:var(--blue)}
.spec-grid{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;font-size:13.5px}
.spec-grid dt{color:var(--ink2)}
.spec-grid dd{font-family:var(--mono);font-weight:500}
.note{margin-top:10px;font-size:12px;color:var(--ink2);border-left:3px solid var(--line);padding-left:8px}
/* ===== 計算フォーム ===== */
.calc-card{background:var(--panel);border:1px solid var(--ink);padding:16px 18px;margin-bottom:16px;max-width:760px}
.calc-card h3{font-size:15px;margin-bottom:10px}
.form-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.form-row label{display:flex;flex-direction:column;font-size:12px;color:var(--ink2);gap:3px}
.result-box{
  margin-top:10px;border:1px solid var(--blue);background:var(--blue-soft);padding:10px 14px;
  font-family:var(--mono);font-size:14px;white-space:pre-wrap;display:none;
}
.result-box.show{display:block}
.result-box .big{font-size:19px;font-weight:600;color:var(--blue)}
.result-box .warn{color:var(--red);font-weight:600}
button.act{
  font-family:var(--sans);font-size:13.5px;font-weight:700;padding:7px 18px;cursor:pointer;
  background:var(--blue);color:#fff;border:1px solid var(--blue);
}
button.act:hover{background:#1a4183}
button.ghost{
  font-family:var(--sans);font-size:12.5px;padding:5px 12px;cursor:pointer;
  background:#fff;color:var(--ink);border:1px solid var(--ink);
}
button.ghost:hover{background:var(--blue-soft)}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* ===== SVG図面 ===== */
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
svg .dim{stroke:var(--blue);stroke-width:1;fill:none}
svg .dimtxt{fill:var(--blue);font-size:11px}
svg .body{stroke:var(--ink);stroke-width:1.6;fill:#fff}
svg .hatch{stroke:var(--ink2);stroke-width:.7}
svg .cl{stroke:var(--red);stroke-width:.7;stroke-dasharray:8 3 2 3}
/* ===== 電卓 ===== */
#calcFab{
  position:fixed;right:22px;bottom:22px;z-index:900;width:58px;height:58px;border-radius:50%;
  background:var(--ink);color:#fff;border:none;font-size:22px;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25);font-family:var(--mono);
}
#calcFab:hover{background:var(--blue)}
#calcWin{
  position:fixed;z-index:950;width:300px;background:var(--panel);border:2px solid var(--ink);
  box-shadow:6px 6px 0 rgba(32,38,46,.18);display:none;top:90px;right:30px;
}
#calcWin.open{display:block}
#calcHead{
  background:var(--ink);color:#fff;padding:6px 10px;font-size:12.5px;cursor:move;
  display:flex;justify-content:space-between;align-items:center;user-select:none;touch-action:none;
}
#calcHead button{background:none;border:none;color:#fff;font-size:15px;cursor:pointer;padding:0 4px}
#calcDisp{
  font-family:var(--mono);padding:8px 10px 2px;text-align:right;min-height:26px;font-size:13px;
  color:var(--ink2);word-break:break-all;
}
#calcRes{font-family:var(--mono);padding:0 10px 8px;text-align:right;font-size:22px;font-weight:600;min-height:32px}
#calcKeys{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
#calcKeys button{
  font-family:var(--mono);font-size:14px;padding:10px 0;border:none;background:var(--panel);cursor:pointer;
}
#calcKeys button:hover{background:var(--blue-soft)}
#calcKeys button.op{background:#F0F2ED}
#calcKeys button.eq{background:var(--blue);color:#fff}
#calcKeys button.eq:hover{background:#1a4183}
#calcHist{max-height:90px;overflow-y:auto;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;padding:4px 10px;color:var(--ink2)}
#calcHist div{cursor:pointer;padding:1px 0}
#calcHist div:hover{color:var(--blue)}
.deg-toggle{font-family:var(--mono);font-size:11px;background:var(--red);padding:1px 6px;border-radius:2px;cursor:pointer}
/* footer note */
.foot-note{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--ink);
  font-size:11px;color:var(--ink2);padding:4px 14px;z-index:800}
@media(max-width:860px){
  .app{flex-direction:column}
  nav{width:100%;display:flex;overflow-x:auto;padding:0}
  .nav-group{display:none}
  .nav-item{white-space:nowrap;padding:10px 12px}
  .nav-item.active::before{left:0;right:0;top:auto;bottom:0;width:auto;height:3px}
  .detail.open{grid-template-columns:1fr}
  .detail-draw{border-right:none;border-bottom:1px dashed var(--line)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="tb-cell tb-title">
    <span class="tb-label">名称 TITLE</span>
    <span class="tb-value">M-TIC <span>設計支援・メカ情報ツール</span></span>

<div class="app">
<nav id="nav"></nav>
<main id="main"></main>

const $=s=>document.querySelector(s);

const threadCalc=(d,p)=>({d2:d-0.6495*p, d1:d-1.0825*p, As:Math.PI/4*Math.pow((d-0.6495*p + d-1.2269*p)/2,2)});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---- SVG 寸法線ヘルパー ---- */
function dimH(x1,x2,y,label,off=0){
 return `<line class="dim" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>
 <line class="dim" x1="${x1}" y1="${y-4}" x2="${x1}" y2="${y+4}"/>
 <line class="dim" x1="${x2}" y1="${y-4}" x2="${x2}" y2="${y+4}"/>
 <text class="dimtxt" x="${(x1+x2)/2}" y="${y-5+off}" text-anchor="middle">${label}</text>`;
}
function dimV(x,y1,y2,label){
 return `<line class="dim" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>
 <line class="dim" x1="${x-4}" y1="${y1}" x2="${x+4}" y2="${y1}"/>
 <line class="dim" x1="${x-4}" y1="${y2}" x2="${x+4}" y2="${y2}"/>
 <text class="dimtxt" x="${x+7}" y="${(y1+y2)/2+4}">${label}</text>`;
}

/* =========================================================

function svgWrap(inner,w=380,h=300){return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`}

// 六角穴付きボルト
function drawCapScrew(r){
 const [nm,d,dk,k,s]=r;
 const sc=Math.min(120/dk, 26); // scale
 const DK=dk*sc, K=k*sc, D=d*sc, L=Math.min(d*3.2*sc,150);
 const cx=120, topY=60;
 let g="";
 // 側面図
 g+=`<rect class="body" x="${cx-DK/2}" y="${topY}" width="${DK}" height="${K}"/>`;
 g+=`<rect class="body" x="${cx-D/2}" y="${topY+K}" width="${D}" height="${L}"/>`;
 // ねじ山ハッチ
 for(let y=topY+K+6;y<topY+K+L-2;y+=7){g+=`<line class="hatch" x1="${cx-D/2}" y1="${y+4}" x2="${cx+D/2}" y2="${y}"/>`}
 g+=`<line class="cl" x1="${cx}" y1="${topY-12}" x2="${cx}" y2="${topY+K+L+12}"/>`;
 // 六角穴（正面から見えるへこみ表現）
 g+=`<rect class="hatch" x="${cx-s*sc/2}" y="${topY+3}" width="${s*sc}" height="${K-6}" fill="none" stroke-dasharray="3 2"/>`;
 g+=dimH(cx-DK/2,cx+DK/2,topY-14,`dk ${dk}`);
 g+=dimH(cx-D/2,cx+D/2,topY+K+L+18,`${nm}`);
 g+=dimV(cx+DK/2+16,topY,topY+K,`k ${k}`);
 // 上面図（六角穴）
 const tx=300,ty=120,R=DK/2;
 g+=`<circle class="body" cx="${tx}" cy="${ty}" r="${R}"/>`;
 let hex="";const rs=s*sc/2/Math.cos(Math.PI/6);
 for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;hex+=`${tx+rs*Math.cos(a)},${ty+rs*Math.sin(a)} `}
 g+=`<polygon class="body" points="${hex}" fill="none"/>`;
 g+=dimH(tx-s*sc/2,tx+s*sc/2,ty-R-10,`s ${s}`);
 g+=`<text x="${tx}" y="${ty+R+18}" text-anchor="middle">上面（六角穴）</text>`;
 return svgWrap(g,380,topY+K+L+40);
}
// 六角ボルト／ナット上面
function hexTop(tx,ty,s,sc,holeD){
 let g="";const rs=s*sc/2/Math.cos(Math.PI/6);let hex="";
 for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;hex+=`${tx+rs*Math.cos(a)},${ty+rs*Math.sin(a)} `}
 g+=`<polygon class="body" points="${hex}"/>`;
 g+=`<circle class="body" cx="${tx}" cy="${ty}" r="${s*sc*0.5*0.95}" fill="none" stroke-dasharray="4 3" stroke-width="0.8"/>`;
 if(holeD)g+=`<circle class="body" cx="${tx}" cy="${ty}" r="${holeD*sc/2}"/>`;
 return g;
}
function drawHexBolt(r){
 const [nm,d,s,k]=r;
 const sc=Math.min(110/s,22);
 const S=s*sc,K=k*sc,D=d*sc,L=Math.min(d*3*sc,140),cx=110,topY=60;
 let g=`<rect class="body" x="${cx-S/2}" y="${topY}" width="${S}" height="${K}"/>
 <rect class="body" x="${cx-D/2}" y="${topY+K}" width="${D}" height="${L}"/>`;
 for(let y=topY+K+6;y<topY+K+L-2;y+=7){g+=`<line class="hatch" x1="${cx-D/2}" y1="${y+4}" x2="${cx+D/2}" y2="${y}"/>`}
 g+=`<line class="cl" x1="${cx}" y1="${topY-12}" x2="${cx}" y2="${topY+K+L+12}"/>`;
 g+=dimH(cx-S/2,cx+S/2,topY-14,`s ${s}`);
 g+=dimV(cx+S/2+16,topY,topY+K,`k ${k}`);
 g+=dimH(cx-D/2,cx+D/2,topY+K+L+18,nm);
 g+=hexTop(295,130,s,sc,0);
 g+=`<text x="295" y="${130+S/2+20}" text-anchor="middle">上面</text>`;
 return svgWrap(g,380,topY+K+L+40);
}
function drawNut(r){
 const [nm,d,s,m]=r;
 const sc=Math.min(110/s,22);
 const S=s*sc,M=m*sc,cx=110,topY=90;
 let g=`<rect class="body" x="${cx-S/2}" y="${topY}" width="${S}" height="${M}"/>`;
 // ねじ穴破線
 g+=`<line class="hatch" x1="${cx-d*sc/2}" y1="${topY}" x2="${cx-d*sc/2}" y2="${topY+M}" stroke-dasharray="4 3"/>`;

 g+=`<line class="cl" x1="${cx}" y1="${topY-14}" x2="${cx}" y2="${topY+M+14}"/>`;
 g+=dimH(cx-S/2,cx+S/2,topY-14,`s ${s}`);
 g+=dimV(cx+S/2+16,topY,topY+M,`m ${m}`);
 g+=hexTop(290,140,s,sc,d);
 g+=dimH(290-d*sc/2,290+d*sc/2,140-S/2-12,`ねじ ${nm}`);
 return svgWrap(g,380,260);
}
function drawWasher(r){
 const [nm,d1,d2,t]=r;
 const sc=Math.min(140/d2,18);
 const cx=120,cy=130;
 let g=`<circle class="body" cx="${cx}" cy="${cy}" r="${d2*sc/2}"/>
 <circle class="body" cx="${cx}" cy="${cy}" r="${d1*sc/2}"/>
 <line class="cl" x1="${cx-d2*sc/2-12}" y1="${cy}" x2="${cx+d2*sc/2+12}" y2="${cy}"/>`;
 g+=dimH(cx-d2*sc/2,cx+d2*sc/2,cy-d2*sc/2-12,`外径 ${d2}`);
 g+=dimH(cx-d1*sc/2,cx+d1*sc/2,cy+d1*sc/2+16,`内径 ${d1}`,26);
 const sx=300;
 const T=Math.max(t*sc,4);
 g+=`<rect class="body" x="${sx-T/2}" y="${cy-d2*sc/2}" width="${T}" height="${d2*sc}"/>`;
 g+=dimH(sx-T/2,sx+T/2,cy-d2*sc/2-12,`t ${t}`);
 g+=`<text x="${sx}" y="${cy+d2*sc/2+18}" text-anchor="middle">側面</text>`;
 return svgWrap(g,380,270);
}
function drawBearing(r){
 const [no,d,D,B]=r;
 const sc=Math.min(180/D,10);
 const cx=150,cy=140,Ro=D*sc/2,Ri=d*sc/2,W=B*sc;
 const ringT=(Ro-Ri)*0.36, ballR=(Ro-Ri)*0.30;
 let g="";
 // 断面（上下）
 for(const sgn of [-1,1]){
  const yOut=cy+sgn*Ro, yOutIn=cy+sgn*(Ro-ringT);
  const yInOut=cy+sgn*(Ri+ringT), yIn=cy+sgn*Ri;
  g+=`<rect class="body" x="${cx-W/2}" y="${Math.min(yOut,yOutIn)}" width="${W}" height="${ringT}"/>`;
  g+=`<rect class="body" x="${cx-W/2}" y="${Math.min(yInOut,yIn)}" width="${W}" height="${ringT}"/>`;
  g+=`<circle class="body" cx="${cx}" cy="${cy+sgn*(Ri+(Ro-Ri)/2)}" r="${ballR}"/>`;
 }
 g+=`<line class="cl" x1="${cx-W/2-24}" y1="${cy}" x2="${cx+W/2+24}" y2="${cy}"/>`;
 g+=dimV(cx-W/2-20,cy-Ro,cy+Ro,`φD ${D}`);
 g+=dimV(cx+W/2+20,cy-Ri,cy+Ri,`φd ${d}`);
 g+=dimH(cx-W/2,cx+W/2,cy-Ro-12,`B ${B}`);
 g+=`<text x="${cx}" y="${cy+Ro+24}" text-anchor="middle">深溝玉軸受 ${no} 断面</text>`;
 return svgWrap(g,380,300);
}
function drawKey(r){
 const [range,b,h,t1,t2]=r;
 // 代表軸径＝範囲上限
 const dmax=parseFloat(range.match(/([0-9.]+)以下/)[1]);
 const sc=Math.min(150/dmax,14);
 const cx=120,cy=150,R=dmax*sc/2,Bw=b*sc,T1=t1*sc;
 let g=`<circle class="body" cx="${cx}" cy="${cy}" r="${R}"/>`;
 // キー溝
 g+=`<rect class="body" x="${cx-Bw/2}" y="${cy-R-2}" width="${Bw}" height="${R-(R-T1)+2}" fill="#fff"/>`;
 g+=`<line class="cl" x1="${cx-R-14}" y1="${cy}" x2="${cx+R+14}" y2="${cy}"/>
 <line class="cl" x1="${cx}" y1="${cy-R-14}" x2="${cx}" y2="${cy+R+14}"/>`;
 g+=dimH(cx-Bw/2,cx+Bw/2,cy-R-16,`b ${b}`);
 g+=dimV(cx+R+22,cy-R+T1,cy+R,`d−t1`);
 g+=`<text x="${cx}" y="${cy+R+28}" text-anchor="middle">軸断面（代表径 φ${dmax}）</text>`;
 // キー本体
 const kx=290,ky=120,Kb=b*sc,Kh=h*sc;
 g+=`<rect class="body" x="${kx-Kb/2}" y="${ky}" width="${Kb}" height="${Kh}"/>`;
 g+=dimH(kx-Kb/2,kx+Kb/2,ky-10,`b ${b}`);
 g+=dimV(kx+Kb/2+14,ky,ky+Kh,`h ${h}`);
 g+=`<text x="${kx}" y="${ky+Kh+20}" text-anchor="middle">キー断面</text>`;
 return svgWrap(g,390,310);
}
function drawSnapRing(r){
 const [d,d2,t,m]=r;
 const sc=Math.min(120/d,14);
 const cx=150,cy=130,R=d*sc/2,R2=d2*sc/2,M=Math.max(m*sc,4);
 const L=140;
 let g=`<rect class="body" x="${cx-L/2}" y="${cy-R}" width="${L}" height="${R*2}"/>`;
 // 溝
 g+=`<rect class="body" x="${cx+20-M/2}" y="${cy-R}" width="${M}" height="${R-R2}" fill="#fff"/>`;
 g+=`<rect class="body" x="${cx+20-M/2}" y="${cy+R2}" width="${M}" height="${R-R2}" fill="#fff"/>`;
 g+=`<line class="cl" x1="${cx-L/2-12}" y1="${cy}" x2="${cx+L/2+12}" y2="${cy}"/>`;
 g+=dimV(cx-L/2-16,cy-R,cy+R,`φd ${d}`);
 g+=dimV(cx+L/2+18,cy-R2,cy+R2,`溝径 ${d2}`);
 g+=dimH(cx+20-M/2,cx+20+M/2,cy-R-12,`溝幅 ${m}`);
 g+=`<text x="${cx}" y="${cy+R+26}" text-anchor="middle">軸の止め輪溝（板厚 t=${t}）</text>`;
 return svgWrap(g,380,280);
}
function drawThread(r){
 const [nm,p,kind]=r;
 const d=parseFloat(nm.slice(1));
 const t=threadCalc(d,p);
 const sc=Math.min(200/d,30);
 const cx=60,cy0=60,H=180;
 const rD=d*sc/2, r2=t.d2*sc/2, r1=t.d1*sc/2;
 const cxm=190;
 let g=`<line class="cl" x1="${cxm}" y1="${cy0-14}" x2="${cxm}" y2="${cy0+H+14}"/>`;
 // ねじ山プロファイル（左右）
 const P=Math.max(p*sc,10);
 for(const sgn of[-1,1]){
  let path=`M ${cxm+sgn*r1} ${cy0}`;
  for(let y=cy0;y<cy0+H-P;y+=P){
   path+=` L ${cxm+sgn*rD} ${y+P/2} L ${cxm+sgn*r1} ${y+P}`;
  }
  g+=`<path class="body" d="${path}" fill="none"/>`;
 }
 g+=dimH(cxm-rD,cxm+rD,cy0-16,`外径 d=${d}`);
 g+=dimH(cxm-r2,cxm+r2,cy0+H+20,`有効径 d2≈${fmt(t.d2)}`,0);
 g+=dimH(cxm-r1,cxm+r1,cy0+H+44,`谷径 d1≈${fmt(t.d1)}`,0);
 g+=dimV(cxm+rD+22,cy0+P/2,cy0+P*1.5,`P ${p}`);
 return svgWrap(g,390,cy0+H+64);
}
function drawPin(dv){
 const sc=Math.min(80/dv,20);
 const D=dv*sc,L=170,cx=190,cy=120;
 let g=`<rect class="body" x="${cx-L/2}" y="${cy-D/2}" width="${L}" height="${D}"/>`;
 g+=`<line class="body" x1="${cx-L/2+8}" y1="${cy-D/2}" x2="${cx-L/2}" y2="${cy-D/2+3}"/>`;
 g+=`<line class="cl" x1="${cx-L/2-12}" y1="${cy}" x2="${cx+L/2+12}" y2="${cy}"/>`;
 g+=dimV(cx+L/2+18,cy-D/2,cy+D/2,`φ${dv}`);
 g+=`<text x="${cx}" y="${cy+D/2+24}" text-anchor="middle">平行ピン（両端面取り）</text>`;
 return svgWrap(g,380,220);
}

/* ---- 汎用テーブルページ ---- */
function tablePage(o){
 // o: {title, std, cols, rows, rowHtml, detail(row), searchKey}
 let html=`<h2 class="page-title">${o.title}</h2><p class="page-sub">${o.std}　<b>行をクリックすると図面と詳細を表示します。</b></p>
 <div class="tool-bar"><input type="text" id="filt" placeholder="絞り込み（例: M3）" aria-label="絞り込み"></div>
 <div class="data-wrap"><table class="data"><thead><tr>${o.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody id="tbody"></tbody></table></div>
 <div class="detail" id="detail"><div class="detail-draw" id="ddraw"></div><div class="detail-info" id="dinfo"></div></div>`;
 $("#main").innerHTML=html;
 const render=q=>{
  const tb=$("#tbody");tb.innerHTML="";
  o.rows.forEach((r,i)=>{
   const key=o.searchKey(r).toLowerCase();
   if(q && !key.includes(q.toLowerCase()))return;
   const tr=document.createElement("tr");
   tr.className="sel-row";tr.innerHTML=o.rowHtml(r);
   tr.onclick=()=>{
    document.querySelectorAll("#tbody tr").forEach(x=>x.classList.remove("selected"));
    tr.classList.add("selected");
    const d=o.detail(r);
    $("#ddraw").innerHTML=d.svg;
    $("#dinfo").innerHTML=d.info;
    $("#detail").classList.add("open");
    $("#detail").scrollIntoView({behavior:"smooth",block:"nearest"});
   };
   tb.appendChild(tr);
  });
 };
 render("");
 $("#filt").addEventListener("input",e=>render(e.target.value.trim()));
}
function specList(pairs){return `<dl class="spec-grid">${pairs.map(p=>`<dt>${p[0]}</dt><dd>${p[1]}</dd>`).join("")}</dl>`}

/* ---- はめあい ---- */
function fitRange(D){for(let i=0;i<FIT_RANGES.length;i++){if(D>FIT_RANGES[i][0]&&D<=FIT_RANGES[i][1])return i}return -1}
// 単品公差を "上/下" 文字列で返す（µm→mm表記）
function fitCalcOne(D,kind,letter,grade){
 const ri=fitRange(D);if(ri<0)return "範囲外";
 const it=IT[grade]?IT[grade][ri]:null;if(it==null)return "等級未対応";
 let hi,lo;
 if(kind==="shaft"){
  const dev=SHAFT_DEV[letter];if(!dev)return "未対応";
  if(dev.type==="js"){hi=it/2;lo=-it/2}
  else if(dev.type==="es"){hi=dev.v[ri];lo=hi-it}
  else{lo=dev.v[ri];hi=lo+it}
 }else{
  const dev=HOLE_DEV[letter];if(!dev)return "未対応";
  if(dev.type==="js"){hi=it/2;lo=-it/2}
  else if(dev.type==="EI"){lo=dev.v[ri];hi=lo+it}
  else{if(grade!==7)return "7級のみ対応";hi=dev.v[ri];lo=hi-it}
 }
 const f=x=>(x>=0?"+":"")+fmt(x/1000,4);
 return `${f(hi)} / ${f(lo)}`;
}
function fitLimits(D,kind,letter,grade){
 const s=fitCalcOne(D,kind,letter,grade);
 if(s.includes("/")===false)return null;
 const [hi,lo]=s.split(" / ").map(parseFloat);
 return {hi,lo};
}
RENDER.fit=()=>{
 const holeOpts=["H6","H7","H8","H9","G7","F7","F8","E8","JS7","K7","N7","P7"];
 const shaftOpts=["e8","f6","f7","g5","g6","h5","h6","h7","h8","h9","js5","js6","js7","k5","k6","m6","n6","p6"];
 const presets=[["H7/g6","精密すきま(位置決め・摺動)"],["H7/h6","すきま最小(手ではめる)"],["H7/js6","中間(軽圧入)"],["H7/k6","中間(たたき込み・ベアリング軸)"],["H7/m6","中間(強め)"],["H7/p6","しまり(圧入)"],["H8/f7","すきま(回転・潤滑)"],["H8/e8","粗いすきま"]];
 $("#main").innerHTML=`<h2 class="page-title">はめあい公差計算</h2>
 <p class="page-sub">JIS B 0401 準拠。基準寸法 1〜120 mm、IT5〜IT11に対応。</p>
 <div class="calc-card">
 <div class="preset-row">${presets.map(p=>`<button class="ghost" data-fit="${p[0]}" title="${p[1]}">${p[0]}</button>`).join("")}</div>
 <div class="form-row">
  <label>基準寸法 mm<input type="number" id="fD" value="10" step="any" min="1" max="120"></label>
  <label>穴<select id="fH">${holeOpts.map(o=>`<option${o==="H7"?" selected":""}>${o}</option>`).join("")}</select></label>
  <label>軸<select id="fS">${shaftOpts.map(o=>`<option${o==="g6"?" selected":""}>${o}</option>`).join("")}</select></label>
 </div>
 <button class="act" id="fGo">計算</button>
 <div class="result-box" id="fRes"></div>
 <p class="note">プリセットの用途例 — H7/g6: リニアブッシュ・位置決めピン ／ H7/k6: ベアリング内輪と回転軸 ／ H7/p6: 圧入固定</p>
 </div>`;
 const go=()=>{
  const D=parseFloat($("#fD").value);
  const h=$("#fH").value, s=$("#fS").value;
  const hL=h.match(/[A-Z]+/)[0], hG=parseInt(h.match(/\d+/)[0]);
  const sL=s.match(/[a-z]+/)[0], sG=parseInt(s.match(/\d+/)[0]);
  const H=fitLimits(D,"hole",hL,hG), S=fitLimits(D,"shaft",sL,sG);
  if(!H||!S){show("#fRes","<span class='warn'>この組合せ・寸法は未対応です（1〜120mm、穴K/N/Pは7級のみ）</span>");return}
  const holeMax=D+H.hi,holeMin=D+H.lo,shMax=D+S.hi,shMin=D+S.lo;
  const cMax=holeMax-shMin, cMin=holeMin-shMax;
  let judge, jc="";
  if(cMin>=0)judge="すきまばめ";
  else if(cMax<=0)judge="しまりばめ";
  else judge="中間ばめ";
  const f=x=>fmt(x,3);
  show("#fRes",
`基準寸法 φ${D}  ${h}/${s}
────────────────────────
穴 ${h}: ${f(holeMax)} 〜 ${f(holeMin)}  (${fitCalcOne(D,"hole",hL,hG)})
軸 ${s}: ${f(shMax)} 〜 ${f(shMin)}  (${fitCalcOne(D,"shaft",sL,sG)})
────────────────────────
最大すきま: ${cMax>=0?"+":""}${f(cMax)} mm
最小すきま: ${cMin>=0?"+":""}${f(cMin)} mm ${cMin<0?"(=しめしろ "+f(-cMin)+")":""}
<span class="big">判定: ${judge}</span>`);
 };
 $("#fGo").onclick=go;
 document.querySelectorAll("[data-fit]").forEach(b=>b.onclick=()=>{
  const [h,s]=b.dataset.fit.split("/");$("#fH").value=h;$("#fS").value=s;go();
 });
 go();
};

RENDER.beam=()=>{
 $("#main").innerHTML=`<h2 class="page-title">はり(梁)のたわみ・応力計算</h2>
 <p class="page-sub">集中荷重。フレームやアーム剛性のあたり付けに。</p>
 <div class="calc-card">
 <div class="form-row">
  <label>支持条件<select id="beamSup"><option value="cant">片持ち・先端荷重</option><option value="simple">両端支持・中央荷重</option><option value="fixed">両端固定・中央荷重</option></select></label>
  <label>断面<select id="beamSec"><option value="rect">長方形 b×h</option><option value="round">丸棒 φd</option><option value="pipe">パイプ φD×φd</option></select></label>
  <label>材料(E)<select id="beamMat">${MATERIALS.map(m=>`<option value="${m[4]}">${m[0]} (E=${m[4]}GPa)</option>`).join("")}</select></label>
 </div>
 <div class="form-row" id="beamDims"></div>
 <div class="form-row">
  <label>荷重 P [N]<input type="number" id="beamP" value="50" step="any"></label>
  <label>長さ L [mm]<input type="number" id="beamL" value="200" step="any"></label>
 </div>
 <button class="act" id="beamGo">計算</button>
 <div class="result-box" id="beamRes"></div>
 <p class="note">たわみ式 — 片持ち: PL³/3EI ／ 両端支持: PL³/48EI ／ 両端固定: PL³/192EI。応力は最大曲げモーメント位置の表面応力。</p>
 </div>`;
 const dimSets={
  rect:[["幅 b mm","sA",20],["高さ h mm","sB",5]],
  round:[["直径 d mm","sA",10]],
  pipe:[["外径 D mm","sA",12],["内径 d mm","sB",10]]
 };
 const rd=()=>{$("#beamDims").innerHTML=dimSets[$("#beamSec").value].map(d=>`<label>${d[0]}<input type="number" id="${d[1]}" value="${d[2]}" step="any"></label>`).join("")};
 rd();$("#beamSec").onchange=rd;
 $("#beamGo").onclick=()=>{
  const sec=$("#beamSec").value;
  const A=parseFloat($("#sA").value),B=$("#sB")?parseFloat($("#sB").value):0;
  let I,Z;
  if(sec==="rect"){I=A*Math.pow(B,3)/12;Z=A*B*B/6}
  else if(sec==="round"){I=Math.PI*Math.pow(A,4)/64;Z=Math.PI*Math.pow(A,3)/32}
  else{I=Math.PI*(Math.pow(A,4)-Math.pow(B,4))/64;Z=I/(A/2)}
  const E=parseFloat($("#beamMat").value)*1000; // GPa→MPa(N/mm²)
  const P=parseFloat($("#beamP").value),L=parseFloat($("#beamL").value);
  const sup=$("#beamSup").value;
  const coef=sup==="cant"?3:(sup==="simple"?48:192);
  const delta=P*Math.pow(L,3)/(coef*E*I);
  const M=sup==="cant"?P*L:(sup==="simple"?P*L/4:P*L/8);
  const sig=M/Z;

/* ---- 頭形状の図 ---- */
function drawHeadScrew(type,r){
 const nm=r[0],d=r[1],dk=r[2],k=r[3];
 const sc=Math.min(130/dk,24);
 const DK=dk*sc,K=Math.max(k*sc,6),D=d*sc,L=Math.min(d*3.2*sc,140);
 const cx=190,topY=70;
 let head="";
 if(type==="pan"){ // なべ：上面がゆるい丸
  head=`<path class="body" d="M ${cx-DK/2} ${topY+K} L ${cx-DK/2} ${topY+K*0.45} Q ${cx-DK/2} ${topY} ${cx-DK/2+DK*0.18} ${topY} L ${cx+DK/2-DK*0.18} ${topY} Q ${cx+DK/2} ${topY} ${cx+DK/2} ${topY+K*0.45} L ${cx+DK/2} ${topY+K} Z"/>`;
  head+=`<line class="hatch" x1="${cx-D*0.35}" y1="${topY+K*0.35}" x2="${cx+D*0.35}" y2="${topY+K*0.35}"/><line class="hatch" x1="${cx}" y1="${topY+2}" x2="${cx}" y2="${topY+K*0.7}"/>`; // 十字穴
 }else if(type==="truss"){ // トラス：低くて幅広いドーム
  head=`<path class="body" d="M ${cx-DK/2} ${topY+K} Q ${cx-DK/2} ${topY+K*0.15} ${cx-DK*0.25} ${topY+K*0.02} Q ${cx} ${topY-K*0.08} ${cx+DK*0.25} ${topY+K*0.02} Q ${cx+DK/2} ${topY+K*0.15} ${cx+DK/2} ${topY+K} Z"/>`;
  head+=`<line class="hatch" x1="${cx-D*0.35}" y1="${topY+K*0.4}" x2="${cx+D*0.35}" y2="${topY+K*0.4}"/><line class="hatch" x1="${cx}" y1="${topY+3}" x2="${cx}" y2="${topY+K*0.75}"/>`;
 }else if(type==="button"){ // ボタン：ドーム＋六角穴
  head=`<path class="body" d="M ${cx-DK/2} ${topY+K} Q ${cx-DK/2} ${topY} ${cx} ${topY} Q ${cx+DK/2} ${topY} ${cx+DK/2} ${topY+K} Z"/>`;
  head+=`<rect class="hatch" x="${cx-r[4]*sc/2}" y="${topY+K*0.25}" width="${r[4]*sc}" height="${K*0.55}" fill="none" stroke-dasharray="3 2"/>`;
 }else if(type==="flat"){ // 皿：面一に沈む
  head=`<path class="body" d="M ${cx-DK/2} ${topY} L ${cx+DK/2} ${topY} L ${cx+D/2} ${topY+K} L ${cx-D/2} ${topY+K} Z"/>`;
  head+=`<rect class="hatch" x="${cx-r[4]*sc/2}" y="${topY+2}" width="${r[4]*sc}" height="${K*0.6}" fill="none" stroke-dasharray="3 2"/>`;
  head+=`<line class="hatch" x1="${cx-DK/2-30}" y1="${topY}" x2="${cx-DK/2}" y2="${topY}"/><line class="hatch" x1="${cx+DK/2}" y1="${topY}" x2="${cx+DK/2+30}" y2="${topY}"/>`; // 取付面
 }
 let g=head;
 g+=`<rect class="body" x="${cx-D/2}" y="${topY+K}" width="${D}" height="${L}"/>`;
 for(let y=topY+K+6;y<topY+K+L-2;y+=7){g+=`<line class="hatch" x1="${cx-D/2}" y1="${y+4}" x2="${cx+D/2}" y2="${y}"/>`}
 g+=`<line class="cl" x1="${cx}" y1="${topY-14}" x2="${cx}" y2="${topY+K+L+12}"/>`;
 g+=dimH(cx-DK/2,cx+DK/2,topY-14,`dk ${dk}`);
 g+=dimV(cx+DK/2+18,topY,topY+K,`k ${k}`);
 g+=dimH(cx-D/2,cx+D/2,topY+K+L+18,nm);
 return svgWrap(g,380,topY+K+L+40);
}
function drawSetScrew(r){
 const [nm,sHex]=r;const d=parseFloat(nm.slice(1));
 const sc=Math.min(90/d,22);const D=d*sc,L=Math.min(d*2.6*sc,150),cx=190,topY=70;
 let g=`<rect class="body" x="${cx-D/2}" y="${topY}" width="${D}" height="${L}"/>`;
 for(let y=topY+6;y<topY+L-6;y+=7){g+=`<line class="hatch" x1="${cx-D/2}" y1="${y+4}" x2="${cx+D/2}" y2="${y}"/>`}
 g+=`<rect class="hatch" x="${cx-sHex*sc/2}" y="${topY+2}" width="${sHex*sc}" height="${Math.min(d*0.8*sc,26)}" fill="none" stroke-dasharray="3 2"/>`;
 g+=`<path class="body" d="M ${cx-D/2} ${topY+L} L ${cx-D*0.3} ${topY+L+D*0.12} L ${cx+D*0.3} ${topY+L+D*0.12} L ${cx+D/2} ${topY+L} " fill="none"/>`; // くぼみ先の面取り
 g+=`<line class="cl" x1="${cx}" y1="${topY-14}" x2="${cx}" y2="${topY+L+D*0.12+12}"/>`;
 g+=dimH(cx-D/2,cx+D/2,topY-14,nm);
 g+=dimH(cx-sHex*sc/2,cx+sHex*sc/2,topY+L+D*0.12+22,`六角穴 s=${sHex}`);
 return svgWrap(g,380,topY+L+70);
}

  <label>中心距離 C [mm]<input type="number" id="tbC" value="80" step="any"></label>
 </div>
 <button class="act" id="tbGo">ベルト長さを計算</button><div class="result-box" id="tbRes"></div>

 <p class="note">GT2はロボット・3Dプリンタの定番。プーリーPCD＝ピッチ×歯数÷π。減速比＝z2/z1。テンションはアイドラで調整できる設計にすると楽。</p></div>

 <div class="form-row">

 $("#gGo").onclick=()=>{

 $("#tbGo").onclick=()=>{

  const L=2*C+Math.PI*(D1+D2)/2+Math.pow(D2-D1,2)/(4*C);
  const zb=L/P;
  show("#tbRes",`PCD: 小プーリー ${fmt(D1,2)} / 大プーリー ${fmt(D2,2)} mm

 };

 };

  const w=+$("#inN").value*2*Math.PI/60, a=w/(+$("#inT").value);
  show("#inRes",`慣性モーメント I = ${(I*1e6).toFixed(2)} g·m²×10⁻³（${fmt(I,6)} kg·m²）
<span class="big">加速トルク T = ${fmt(I*a,4)} N·m</span>（角加速度 ${fmt(a,1)} rad/s²）`);
 };
};

  const s=sorted[0],l=sorted[3];
  const sum1=s[1]+l[1],sum2=sorted[1][1]+sorted[2][1];
  if(sum1>sum2)return {ok:false,type:"トリプルロッカー（どのリンクも1回転できない）",crank:false};

 };

  if(d>L.b+L.c||d<Math.abs(L.b-L.c))return null;
  const al=Math.acos((L.b*L.b+d*d-L.c*L.c)/(2*L.b*d));
  const phi=Math.atan2(dy,dx);
  const t=phi-al;
  const Cx=Bx+L.b*Math.cos(t),Cy=By+L.b*Math.sin(t);
  // カプラ点: BC中点から左法線方向へh
  const mx=(Bx+Cx)/2,my=(By+Cy)/2;
  const ux=(Cx-Bx)/L.b,uy=(Cy-By)/L.b;
  const Px=mx-uy*L.h,Py=my+ux*L.h;

 const loop=()=>{

 };
 ["fbG","fbA","fbB","fbC","fbH"].forEach(id=>$("#"+id).addEventListener("input",()=>{trace=[];judge();draw()}));
 $("#fbTh").addEventListener("input",e=>{th=+e.target.value;$("#fbThV").textContent=Math.round(th)+"°";draw()});

};

  <label>中心距離 C [mm]<input type="number" id="chC" value="150" step="any"></label>
 </div>
 <button class="act" id="chGo">計算</button><div class="result-box" id="chRes"></div>
 <p class="note">PCD＝p/sin(180°/z)。リンク数は偶数に丸めるのが原則（奇数はオフセットリンクが必要になり強度が落ちる）。中心距離はピッチの30〜50倍あたりが扱いやすい。</p></div>
 <div class="calc-card"><h3>実装のコツ</h3>
 <div class="data-wrap"><table class="data"><thead><tr><th>コツ</th><th>内容</th></tr></thead><tbody>
 <tr><td class="jp">たるみは張り側でなく緩み側に</td><td class="jp">スパン中央で1〜2%程度のたるみが適正。張りすぎは軸受と効率を痛める</td></tr>
 <tr><td class="jp">テンショナー（アイドラ）</td><td class="jp">中心距離を固定したいときの調整代。緩み側の外側から押すのが基本</td></tr>
 <tr><td class="jp">最小歯数</td><td class="jp">高速なら17枚以上推奨、低速でも11枚以上が無難（少ないと多角形運動で振動）</td></tr>

 </tbody></table></div></div>`;

  let Le=Math.ceil(Lp);if(Le%2)Le++;

チェーン全長 ≈ ${fmt(Le*p,1)} mm`);
 };
};

  <label>肘の向き<select id="arElbow"><option value="1">肘上（外）</option><option value="-1">肘下（内）</option></select></label>

 <div class="form-row">

 <p class="note">T1＝g×[W(L1＋L2)＋m1·L1/2＋m2(L1＋L2/2)]、T2＝g×[W·L2＋m2·L2/2]。静的保持トルクなので、動かす分＋余裕で安全率をかけてサーボ・モーターを選定。スカラ（水平）ならこの重力トルクはほぼゼロになるのが強み。</p></div>`;
 const S=1.3,OX=230,OY=190,VW=460,VH=340;
 const txp=x=>OX+x*S, typ=y=>OY-y*S;
 const get=()=>({L1:+$("#arL1").value,L2:+$("#arL2").value,t1:+$("#arT1").value*Math.PI/180,t2:+$("#arT2").value*Math.PI/180});
 let target=null;
 const draw=()=>{
  const {L1,L2,t1,t2}=get();
  const x1=L1*Math.cos(t1),y1=L1*Math.sin(t1);
  const x2=x1+L2*Math.cos(t1+t2),y2=y1+L2*Math.sin(t1+t2);
  const mode=$("#arMode").value;
  let g="";
  g+=`<circle cx="${txp(0)}" cy="${typ(0)}" r="${(L1+L2)*S}" fill="rgba(32,38,46,.06)"/>`;
  if(Math.abs(L1-L2)>0)g+=`<circle cx="${txp(0)}" cy="${typ(0)}" r="${Math.abs(L1-L2)*S}" fill="#FCFDFB"/>`;
  if(mode==="v"){g+=`<line class="hatch" x1="10" y1="${typ(0)}" x2="${VW-10}" y2="${typ(0)}"/><text x="${VW-14}" y="${typ(0)+16}" text-anchor="end">地面方向 ↓重力</text>`}
  else{g+=`<text x="${VW-14}" y="20" text-anchor="end">上から見た図（重力は紙面奥）</text>`}
  g+=`<line x1="${txp(0)}" y1="${typ(0)}" x2="${txp(x1)}" y2="${typ(y1)}" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/>`;
  g+=`<line x1="${txp(x1)}" y1="${typ(y1)}" x2="${txp(x2)}" y2="${typ(y2)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`;
  [[0,0],[x1,y1]].forEach(q=>{g+=`<circle cx="${txp(q[0])}" cy="${typ(q[1])}" r="6" fill="#fff" stroke="var(--ink)" stroke-width="1.8"/>`});
  g+=`<circle cx="${txp(x2)}" cy="${typ(y2)}" r="5" fill="var(--blue)"/>`;
  if(target)g+=`<line class="dim" x1="${txp(target[0])-8}" y1="${typ(target[1])-8}" x2="${txp(target[0])+8}" y2="${typ(target[1])+8}"/><line class="dim" x1="${txp(target[0])-8}" y1="${typ(target[1])+8}" x2="${txp(target[0])+8}" y2="${typ(target[1])-8}"/>`;
  const svg=document.getElementById("arSvg");if(svg)svg.innerHTML=g;
  $("#arRes").innerHTML=`手先位置: X = <b>${fmt(x2,1)}</b> mm, Y = <b>${fmt(y2,1)}</b> mm　（θ1=${fmt(t1*180/Math.PI,1)}°, θ2=${fmt(t2*180/Math.PI,1)}°）`;
 };
 const ik=(x,y)=>{
  const {L1,L2}=get();
  const d2=x*x+y*y,d=Math.sqrt(d2);
  if(d>L1+L2||d<Math.abs(L1-L2)){$("#arRes").innerHTML=`<span class="warn">目標(${fmt(x,0)}, ${fmt(y,0)})は到達範囲外です（届く距離: ${fmt(Math.abs(L1-L2),0)}〜${fmt(L1+L2,0)}mm）</span>`;return}
  const e=+$("#arElbow").value;
  const c2=(d2-L1*L1-L2*L2)/(2*L1*L2);
  const t2=e*Math.acos(Math.max(-1,Math.min(1,c2)));
  const t1=Math.atan2(y,x)-Math.atan2(L2*Math.sin(t2),L1+L2*Math.cos(t2));

  $("#arT1v").textContent=Math.round(t1*180/Math.PI)+"°";$("#arT2v").textContent=Math.round(t2*180/Math.PI)+"°";
  target=[x,y];draw();
 };
 ["arL1","arL2","arMode","arElbow"].forEach(id=>$("#"+id).addEventListener("input",draw));
 $("#arT1").addEventListener("input",e=>{$("#arT1v").textContent=e.target.value+"°";target=null;draw()});
 $("#arT2").addEventListener("input",e=>{$("#arT2v").textContent=e.target.value+"°";target=null;draw()});
 $("#arIK").onclick=()=>ik(+$("#arX").value,+$("#arY").value);
 document.getElementById("arSvg").addEventListener("click",e=>{

  const vx=(e.clientX-r.left)/r.width*VW, vy=(e.clientY-r.top)/r.height*VH;
  const x=(vx-OX)/S, y=(OY-vy)/S;
  $("#arX").value=fmt(x,0);$("#arY").value=fmt(y,0);ik(x,y);
 });
 $("#arTGo").onclick=()=>{
  const L1=+$("#arL1").value/1000,L2=+$("#arL2").value/1000;
  const W=+$("#arW").value/1000,m1=+$("#arM1").value/1000,m2=+$("#arM2").value/1000,sf=+$("#arSf").value;
  const g=9.80665;
  const T1=g*(W*(L1+L2)+m1*L1/2+m2*(L1+L2/2));
  const T2=g*(W*L2+m2*L2/2);
  show("#arTRes",`肩関節 T1 ≈ ${fmt(T1,3)} N·m → <span class="big">選定目安 ${fmt(T1*sf,3)} N·m（${fmt(T1*sf/9.80665*100,0)} kgf·cm）</span>
肘関節 T2 ≈ ${fmt(T2,3)} N·m → 選定目安 ${fmt(T2*sf,3)} N·m（${fmt(T2*sf/9.80665*100,0)} kgf·cm）
※RCサーボのカタログ表記はkgf·cm。減速機やばね補償（重力キャンセル）でT1は大きく減らせます。`);
 };
 draw();
};

/* =========================================================
   関数電卓
   ========================================================= */
let calcExpr="", degMode=true;
const KEYS_LAYOUT=[
 ["sin","cos","tan","π","C"],
 ["asin","acos","atan","e","⌫"],
 ["log","ln","√","^","("],
 ["7","8","9","/",")"],
 ["4","5","6","*","%"],
 ["1","2","3","-","Ans"],
 ["0",".","±","+","="]
];
let lastAns=0;
function calcInit(){
 const keys=$("#calcKeys");
 KEYS_LAYOUT.flat().forEach(k=>{
  const b=document.createElement("button");
  b.textContent=k;
  if("+-*/^%()".includes(k)||["sin","cos","tan","asin","acos","atan","log","ln","√","π","e","±","Ans"].includes(k))b.className="op";
  if(k==="=")b.className="eq";
  b.onclick=()=>keyPress(k);
  keys.appendChild(b);
 });
 $("#calcFab").onclick=()=>{$("#calcWin").classList.toggle("open")};
 $("#calcClose").onclick=()=>$("#calcWin").classList.remove("open");
 $("#calcClearHist").onclick=()=>$("#calcHist").innerHTML="";
 $("#degToggle").onclick=()=>{degMode=!degMode;$("#degToggle").textContent=degMode?"DEG":"RAD";update()};
 // ドラッグ移動
 const win=$("#calcWin"),head=$("#calcHead");
 let drag=null;
 const start=(x,y)=>{const r=win.getBoundingClientRect();drag={dx:x-r.left,dy:y-r.top};win.style.right="auto"};
 const move=(x,y)=>{if(!drag)return;win.style.left=Math.max(0,Math.min(x-drag.dx,innerWidth-80))+"px";win.style.top=Math.max(0,Math.min(y-drag.dy,innerHeight-60))+"px"};
 head.addEventListener("mousedown",e=>{if(e.target.tagName!=="BUTTON"&&!e.target.classList.contains("deg-toggle")){start(e.clientX,e.clientY);e.preventDefault()}});
 addEventListener("mousemove",e=>move(e.clientX,e.clientY));
 addEventListener("mouseup",()=>drag=null);
 head.addEventListener("touchstart",e=>{if(e.target.tagName!=="BUTTON"&&!e.target.classList.contains("deg-toggle")){const t=e.touches[0];start(t.clientX,t.clientY)}},{passive:true});
 addEventListener("touchmove",e=>{if(drag){const t=e.touches[0];move(t.clientX,t.clientY)}},{passive:true});
 addEventListener("touchend",()=>drag=null);
 // キーボード入力
 addEventListener("keydown",e=>{
  if(!$("#calcWin").classList.contains("open"))return;
  if(document.activeElement&&["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;
  if(/^[0-9+\-*/().^%]$/.test(e.key)){keyPress(e.key)}
  else if(e.key==="Enter"){keyPress("=");e.preventDefault()}
  else if(e.key==="Backspace")keyPress("⌫");
  else if(e.key==="Escape")$("#calcWin").classList.remove("open");
 });
}
function keyPress(k){
 if(k==="C"){calcExpr="";update();return}
 if(k==="⌫"){
  const m=calcExpr.match(/(asin|acos|atan|sin|cos|tan|log|ln|√|Ans)$/);
  calcExpr=m?calcExpr.slice(0,-m[0].length):calcExpr.slice(0,-1);
  update();return}
 if(k==="="){evaluate();return}
 if(k==="±"){
  // 最後の数値の符号反転
  const m=calcExpr.match(/(\d+\.?\d*)$/);
  if(m){calcExpr=calcExpr.slice(0,-m[0].length)+"(-"+m[0]+")"}
  update();return}
 if(k==="√"){calcExpr+="sqrt(";update();return}
 if(["sin","cos","tan","asin","acos","atan","log","ln"].includes(k)){calcExpr+=k+"(";update();return}
 calcExpr+=k;update();
}
function update(){
 $("#calcDisp").textContent=calcExpr||"\u00a0";
 // ライブプレビュー
 const v=tryEval(calcExpr);
 $("#calcRes").textContent=(v==null)?(calcExpr?"…":"0"):fmtCalc(v);
}
function fmtCalc(v){
 if(!isFinite(v))return "エラー";
 if(Math.abs(v)>=1e10||(Math.abs(v)<1e-7&&v!==0))return v.toExponential(6);
 return Number(v.toPrecision(10)).toString();
}
function tryEval(expr){
 if(!expr)return null;
 try{return calcEval(expr)}catch(e){return null}
}
function calcEval(expr){
 // トークン検証
 const ok=/^(\s|\d|\.|\+|\-|\*|\/|\(|\)|\^|%|π|e|Ans|sin|cos|tan|asin|acos|atan|log|ln|sqrt)+$/;
 if(!ok.test(expr))throw new Error("invalid");
 let s=expr
  .replace(/Ans/g,`(${lastAns})`)
  .replace(/π/g,"(F.PI)")
  .replace(/\^/g,"**")
  .replace(/%/g,"*0.01")
  .replace(/(asin|acos|atan|sin|cos|tan|log|ln|sqrt)/g,"F.$1")
  .replace(/(?<![a-zA-Z.])e(?![a-zA-Z0-9])/g,"(F.E)");
 const rad=x=>degMode?x*Math.PI/180:x;
 const inv=x=>degMode?x*180/Math.PI:x;
 const F={
  PI:Math.PI,E:Math.E,
  sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),
  asin:x=>inv(Math.asin(x)),acos:x=>inv(Math.acos(x)),atan:x=>inv(Math.atan(x)),
  log:Math.log10,ln:Math.log,sqrt:Math.sqrt
 };
 // 置換後の安全確認
 if(/[a-zA-Z]/.test(s.replace(/F\.(PI|E|sin|cos|tan|asin|acos|atan|log|ln|sqrt)/g,"")))throw new Error("invalid");
 const v=Function("F",`"use strict";return (${s})`)(F);
 if(typeof v!=="number")throw new Error("invalid");
 return v;
}
function evaluate(){
 const v=tryEval(calcExpr);
 if(v==null||!isFinite(v)){$("#calcRes").textContent="エラー";return}
 lastAns=v;
 const h=document.createElement("div");
 h.textContent=`${calcExpr} = ${fmtCalc(v)}`;
 h.onclick=()=>{calcExpr=String(fmtCalc(v));update()};
 $("#calcHist").prepend(h);
 calcExpr=fmtCalc(v);
 update();
}

buildNav();
calcInit();
</script>
